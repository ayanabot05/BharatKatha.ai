# Run on a Google Cloud VM, not the creator's laptop.
services:
  app:
    image: ${BETA_IMAGE:?Set BETA_IMAGE to the cloud-built image}
    restart: unless-stopped
    env_file: beta.env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      BETA_DOMAIN: ${BETA_DOMAIN:?Set BETA_DOMAIN to your beta domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
